name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_skill.py

  windows-snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise read-only snapshot contract
        shell: pwsh
        run: ./tests/Test-RamRaccoonSnapshot.ps1
