name: Bug report
description: Report incorrect diagnostics, platform support, or recovery behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove usernames, paths, command arguments, tokens, and task content before posting.
  - type: input
    id: version
    attributes:
      label: RAM Raccoon version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, and Node version
      description: Include the Codex version only if the report concerns Codex.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Execution environment
      options:
        - Native operating system
        - WSL guest
        - Linux container
        - Remote host
        - Emulated or restricted runtime
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
      description: Run ramraccoon doctor --json, or describe why it could not run. Remove sensitive names, IDs, paths, and error details.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the command and sanitized measurements. Do not paste full process command lines or task checkpoints.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private paths, usernames, and task content.
          required: true
