<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RAM Raccoon</title>
  <desc id="desc">Editorial poster for RAM Raccoon, a Codex housekeeping skill, with bold typography and an abstract striped raccoon tail.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .07"/>
      </feComponentTransfer>
    </filter>
    <path id="tail-shape" d="M1130 742c-85-172-27-371 129-505 104-89 235-77 287 15 50 88 4 189-78 214-73 22-142-20-153-85-7-41 13-76 49-97-65 3-126 52-164 123-59 112-51 231 37 315Z"/>
    <clipPath id="tail">
      <use href="#tail-shape"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#F0EADF"/>
  <rect width="1600" height="900" fill="#161514" filter="url(#paper)" opacity=".32"/>
  <rect width="24" height="900" fill="#E2552D"/>

  <g fill="#161514">
    <text x="82" y="86" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="700" letter-spacing="2.4">OPEN-SOURCE CODEX SKILL</text>
    <text x="82" y="126" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="1.8">AGENT AUDIT  /  MEMORY PRESSURE  /  SAFE HANDOFF</text>
    <text x="1516" y="86" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="700">RR—001</text>
  </g>
  <path d="M82 154H1518" stroke="#161514" stroke-width="3"/>

  <g font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" fill="#161514" letter-spacing="-12">
    <text x="70" y="350" font-size="212">RAM</text>
    <text x="70" y="544" font-size="212" textLength="820" lengthAdjust="spacingAndGlyphs">RACCOON</text>
  </g>
  <rect x="755" y="502" width="34" height="34" fill="#E2552D"/>

  <text x="82" y="624" fill="#161514" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="-1">Know what still needs to run.</text>
  <text x="84" y="672" fill="#5D5853" font-family="Arial,Helvetica,sans-serif" font-size="24">Housekeeping for long-running Codex sessions.</text>

  <path d="M82 728H790" stroke="#161514" stroke-width="2"/>
  <text x="82" y="774" fill="#E2552D" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">$</text>
  <text x="112" y="774" fill="#161514" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19">npx skills add krutftw/ramraccoon@ramraccoon -g -y</text>
  <text x="82" y="840" fill="#5D5853" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="1.7">CONVERSATION FIRST  /  READ-ONLY RUNTIME SNAPSHOT  /  NO PROCESS KILLING</text>

  <g aria-label="Abstract striped raccoon tail">
    <use href="#tail-shape" fill="#E2552D" stroke="#161514" stroke-width="9" stroke-linejoin="round"/>
    <g clip-path="url(#tail)" fill="#161514">
      <path d="m1040 614 213 166 104-45-265-210Z"/>
      <path d="m1074 456 213 158 78-75-244-183Z"/>
      <path d="m1163 309 205 132 54-83-209-137Z"/>
      <path d="m1312 173 251 156 20 112-313-192Z"/>
    </g>
    <rect x="1005" y="296" width="26" height="26" fill="#E2552D"/>
    <rect x="1056" y="239" width="18" height="18" fill="#161514"/>
    <rect x="1005" y="190" width="12" height="12" fill="#161514"/>
    <path d="m1018 304 79 35m-32-91 68 37" fill="none" stroke="#161514" stroke-width="3" stroke-dasharray="6 10"/>
  </g>

  <g fill="#161514" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1.3">
    <text x="1052" y="810">KEEP  /  INTERRUPT  /  HAND OFF</text>
  </g>
  <rect x="1012" y="798" width="18" height="18" fill="#E2552D"/>
</svg>
