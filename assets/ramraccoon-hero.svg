<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">RAM Raccoon — know where your memory goes</title>
  <desc id="desc">A warm ivory banner with bold charcoal lettering and RAM Raccoon's striped vermilion tail. Local memory diagnostics for humans and coding agents.</desc>
  <defs>
    <path id="tail-shape" d="M1130 742c-85-172-27-371 129-505 104-89 235-77 287 15 50 88 4 189-78 214-73 22-142-20-153-85-7-41 13-76 49-97-65 3-126 52-164 123-59 112-51 231 37 315Z"/>
    <clipPath id="tail">
      <use href="#tail-shape"/>
    </clipPath>
  </defs>

  <rect width="1600" height="540" fill="#F0EADF"/>
  <rect width="16" height="540" fill="#E2552D"/>

  <g font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" fill="#161514" letter-spacing="-5">
    <text x="76" y="218" font-size="174">RAM</text>
    <text x="76" y="390" font-size="174">RACCOON</text>
  </g>
  <rect x="540" y="190" width="28" height="28" fill="#E2552D"/>
  <text x="82" y="480" fill="#5D5853" font-family="Arial,Helvetica,sans-serif" font-size="38">Know where your memory goes.</text>

  <g transform="translate(390 -34) scale(.70)" aria-label="Abstract striped raccoon tail">
    <use href="#tail-shape" fill="#E2552D" stroke="#161514" stroke-width="9" stroke-linejoin="round"/>
    <g clip-path="url(#tail)" fill="#161514">
      <path d="m1040 614 213 166 104-45-265-210Z"/>
      <path d="m1074 456 213 158 78-75-244-183Z"/>
      <path d="m1163 309 205 132 54-83-209-137Z"/>
      <path d="m1312 173 251 156 20 112-313-192Z"/>
    </g>
  </g>
</svg>
