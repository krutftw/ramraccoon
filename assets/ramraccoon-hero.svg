<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RAM Raccoon</title>
  <desc id="desc">RAM Raccoon brand hero with a geometric mascot and a runtime housekeeping terminal.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121713"/>
      <stop offset="1" stop-color="#080B09"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#263028" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#wash)"/>
  <rect width="1600" height="900" rx="44" fill="url(#grid)" opacity=".42"/>
  <circle cx="227" cy="196" r="104" fill="#0B0F0C" stroke="#374139" stroke-width="2"/>
  <path d="m168 173-25-47 66 22m77 25 25-47-66 22" fill="#77827A"/>
  <path d="M227 119c66 0 108 44 108 104 0 70-47 110-108 110s-108-40-108-110c0-60 42-104 108-104Z" fill="#D8DDD7"/>
  <path d="M124 203c29-38 63-49 103-23-23 65-70 75-103 23Zm206 0c-29-38-63-49-103-23 23 65 70 75 103 23Z" fill="#242B26"/>
  <path d="M174 201c15-12 33-11 46 4-11 22-36 27-54 10 1-5 3-10 8-14Zm106 0c-15-12-33-11-46 4 11 22 36 27 54 10-1-5-3-10-8-14Z" fill="#B8FF3D"/>
  <circle cx="193" cy="209" r="8" fill="#0B0F0C"/>
  <circle cx="261" cy="209" r="8" fill="#0B0F0C"/>
  <path d="m227 230 29 24-29 19-29-19 29-24Z" fill="#0B0F0C"/>
  <path d="M99 165h33m190 0h33M99 278h33m190 0h33" stroke="#B8FF3D" stroke-width="9" stroke-linecap="round"/>
  <text x="104" y="440" fill="#F3F5F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="760" letter-spacing="-4">RAM RACCOON</text>
  <text x="110" y="508" fill="#A7B0A9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="500">Keeps runaway agents from trashing your RAM.</text>
  <g transform="translate(108 602)">
    <rect width="212" height="48" rx="24" fill="#B8FF3D"/>
    <text x="106" y="32" text-anchor="middle" fill="#0B0F0C" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700">READ-ONLY FIRST</text>
    <rect x="230" width="212" height="48" rx="24" fill="#192019" stroke="#3A463C"/>
    <text x="336" y="32" text-anchor="middle" fill="#D8DDD7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700">WINDOWS PREVIEW</text>
  </g>
  <g transform="translate(930 120)" filter="url(#shadow)">
    <rect width="560" height="660" rx="28" fill="#0D120E" stroke="#334036" stroke-width="2"/>
    <rect width="560" height="68" rx="28" fill="#151C16"/>
    <path d="M0 68h560" stroke="#334036"/>
    <circle cx="34" cy="34" r="8" fill="#FF6B62"/>
    <circle cx="61" cy="34" r="8" fill="#F4C95D"/>
    <circle cx="88" cy="34" r="8" fill="#B8FF3D"/>
    <text x="122" y="42" fill="#748078" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">ramraccoon — audit</text>
    <text x="38" y="126" fill="#B8FF3D" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22">$ ramraccoon audit</text>
    <text x="38" y="184" fill="#F3F5F2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">AGENTS</text>
    <text x="505" y="184" text-anchor="end" fill="#A7B0A9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">6 → 2 needed</text>
    <path d="M38 210h484" stroke="#283229"/>
    <text x="38" y="256" fill="#F3F5F2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">MCP SETS</text>
    <text x="505" y="256" text-anchor="end" fill="#FFB570" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">16 repeated</text>
    <path d="M38 282h484" stroke="#283229"/>
    <text x="38" y="328" fill="#F3F5F2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">PRESSURE</text>
    <text x="505" y="328" text-anchor="end" fill="#FF6B62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">CRITICAL</text>
    <path d="M38 354h484" stroke="#283229"/>
    <text x="38" y="414" fill="#748078" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">DECISION</text>
    <rect x="38" y="442" width="484" height="70" rx="14" fill="#141B15" stroke="#2A352C"/>
    <circle cx="72" cy="477" r="8" fill="#B8FF3D"/>
    <text x="94" y="484" fill="#D8DDD7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">keep unique work, interrupt duplicates</text>
    <rect x="38" y="532" width="484" height="84" rx="14" fill="#B8FF3D"/>
    <text x="62" y="566" fill="#0B0F0C" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700">NEXT</text>
    <text x="62" y="594" fill="#0B0F0C" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700">checkpoint + restart when safe</text>
  </g>
  <text x="110" y="824" fill="#59645C" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" letter-spacing="2">AGENT RESIDENCY AUDIT / MCP PRESSURE / SAFE RESTART</text>
